services:
  - type: web
    name: admission-portal
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn admissiom.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: admissiom.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DATABASE_URL
        fromDatabase:
          name: admission-portal-db
          property: connectionString

databases:
  - name: admission-portal-db
    databaseName: admission_portal
    user: admission_portal_user
    plan: free 